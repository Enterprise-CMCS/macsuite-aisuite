; Local-development fallbacks. Deployed environments override the keys below with
; environment variables (see Helper.ENV_PROPERTY_OVERRIDES):
;   aws_region                     -> AWS_REGION / AWS_DEFAULT_REGION
;   input_bucket_name              -> DOCUMENTS_BUCKET
;   output_bucket                  -> POST_PROCESSING_BUCKET
;   RagSplitOutPutBucket           -> POST_PROCESSING_BUCKET
;   code_bucket_name               -> PIPELINE_CODE_BUCKET
;   temp_bucket_name               -> PIPELINE_TEMP_BUCKET
;   vector-db-admin-secret         -> DB_SECRET_ARN / DB_SECRET_NAME
;   foundation_llm_model_id        -> BEDROCK_MODEL_ID
;   model_id_bedrock_profile_embed -> BEDROCK_EMBED_MODEL_ID
;   embeddings_table_name          -> EMBEDDINGS_TABLE_NAME
;
; Per-contract path/table keys live under [contract:…] sections. Exactly one
; section must have active = true. Helper overlays that section onto [default].
[default]
projectname = BDA-Output-Test
projectdescription = Testing the BDA Output and function
ProjectStage=DEVELOPMENT
aws_region = us-east-1
vector-db-admin-secret = aisuite/dev/rag-app-db-credentials
aws_client_secretsmanager=secretsmanager

input_bucket_name = aisuite-dev-contract-rag
input_prefix =
output_bucket = aisuite-dev-contract-rag-post-processing
output_prefix = bdaoutput/
full_refresh = True

code_bucket_name = aisuite-dev-llm-pipeline-code
temp_bucket_name = aisuite-dev-llm-pipeline-temp
DataAutomationV=us.data-automation-v1


foundation_llm_model_id = us.amazon.nova-pro-v1:0
model_id_bedrock_embeddings=amazon.titan-embed-text-v2:0
PGVector = PGVECTOR


BDATextOutputFolder = BDATextOutput/
BDATableOutputFolder = BDATableOutput/
BDAImageOutputFolder = BDAImageOutput/

BDATextOutputFilename   = Output-BDA-texts.json
BDATableOutputFilename = Output-BDA-tables.json
BDAImageOutputFilename = Output-BDA-images.json

TempFolder=processtempfiles/
SummaryLogFolder=summarylog/
APP_LOG_LEVEL = DEBUG

OutPutExcelJsonFolderPreProcess=output_excel_json/


RagSplitOutPutBucket = aisuite-dev-contract-rag-post-processing
RagSplitOutPutFolder = rag_output/
RagSplitOutPutFile = split_final_document_data.json

embeddings_table_name = embeddings

embedding_dimension=1536
embedding_batch_size=20
image_batch_size=10
concurrent_bedrock_image_calls=5
db_pool_min=2
db_pool_max=5

model_id_bedrock_profile_embed = us.cohere.embed-v4:0
model_id_cohere_reranker=cohere.rerank-v3-5:0

