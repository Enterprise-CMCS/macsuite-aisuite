[default]
# --- Project ---
projectname = BDA-Output-Test
projectdescription = Testing the BDA Output and function
ProjectStage = DEVELOPMENT
APP_LOG_LEVEL = DEBUG

# --- AWS ---
aws_region = us-east-1
aws_client_secretsmanager = secretsmanager
vector-db-admin-secret = aisuite/dev/rag-app-db-credentials

# --- S3 buckets ---
input_bucket_name = aisuite-dev-contract-rag
output_bucket = aisuite-dev-contract-rag-post-processing
temp_bucket_name = aisuite-dev-llm-pipeline-temp
RagSplitOutPutBucket = aisuite-dev-contract-rag-post-processing
RagSplitOutPutFile = split_final_document_data.json
SummaryLogFolder = summarylog/

# --- Bedrock models ---
DataAutomationV = us.data-automation-v1
foundation_llm_model_id = us.amazon.nova-2-lite-v1:0
model_id_bedrock_embeddings = amazon.titan-embed-text-v2:0
model_id_bedrock_profile_embed = us.cohere.embed-v4:0
model_id_cohere_reranker = cohere.rerank-v3-5:0

# --- Embeddings and batching ---
embedding_dimension = 1536
embedding_batch_size = 20
image_batch_size = 10
concurrent_bedrock_image_calls = 5

# --- Database pool ---
db_pool_min = 2
db_pool_max = 5

# --- Contracts ---
# Each section overlays [default]. Exactly one contract may be active.

[contract:ok_1]
active = true
input_prefix = OK_contract/
output_prefix = OK_contract_bdaoutput/
BDATextOutputFolder = OK_contract_bdaoutput/BDATextOutput/
BDATableOutputFolder = OK_contract_bdaoutput/BDATableOutput/
BDAImageOutputFolder = OK_contract_bdaoutput/BDAImageOutput/
RagSplitOutPutFolder = OK_contract_bdaoutput/ragoutput/
embeddings_table_name = embeddings_ok_1

# Shared regulations: 42 CFR Part 438 and the CMS State Guide. The decision agent
# reads this table as context, never as contract evidence. Set active = true only
# while re-ingesting it.
[contract:common_cms_regs]
active = false
input_prefix = CMS_common/
output_prefix = CMS_common_bdaoutput/
BDATextOutputFolder = CMS_common_bdaoutput/BDATextOutput/
BDATableOutputFolder = CMS_common_bdaoutput/BDATableOutput/
BDAImageOutputFolder = CMS_common_bdaoutput/BDAImageOutput/
RagSplitOutPutFolder = RAG_Output/CMS_common/
embeddings_table_name = embeddings_cms_regs
