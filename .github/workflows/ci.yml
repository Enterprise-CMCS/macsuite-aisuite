name: AISuite CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aisuite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      AISUITE_DEPLOY_REGION: ${{ vars.AISUITE_DEPLOY_REGION || 'us-east-1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm test

      # Stub VPC avoids assuming the deploy role on PRs (AdministratorAccess).
      # Deploy workflow performs live Vpc.fromLookup after OIDC.
      - name: Synthesize CDK templates
        run: |
          pnpm run cdk:synth --context environment=dev --context aisuite:stubVpc=true
          pnpm run cdk:synth --context environment=qa --context aisuite:stubVpc=true
          pnpm run cdk:synth --context environment=uat --context aisuite:stubVpc=true
          pnpm run cdk:synth --context environment=prod --context aisuite:stubVpc=true
